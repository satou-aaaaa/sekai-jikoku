<style>
/* 旅の時計：うすい空色の紙、紺の文字、夜は紺のかげ。出す町は青い●、答える町は朱の◆ */
:root{
  --bg:#eef1f5; --paper:#fdfcf8; --ink:#17233a; --ink2:#46506a; --line:#17233a24;
  --sea:#d3e3ef; --land:#f6f1e3; --border:#7b8aa3; --night:#0e1c3d; --band:#17233a1c;
  --green:#1d5c8f; --green2:#123f63; --mt:#b2461b; --mt2:#7f2f0f; --red:#a8321f; --gold:#9a6a08;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-title:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(90deg,transparent 0 59px,#7b8aa314 59px 60px);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:900;font-size:20px;margin:0;letter-spacing:.04em;flex:1}
h1 small{display:block;font-size:12px;letter-spacing:0;color:var(--ink2);font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.dots{display:flex;gap:6px;flex:1;max-width:170px}
.dots i{flex:1;height:7px;border-radius:4px;background:transparent;border:1.5px solid var(--border);box-sizing:border-box}
.dots i.on{background:var(--mt);border-color:var(--mt);height:11px;margin-top:-2px}.dots i.done{background:var(--ink);border-color:var(--ink)}
button.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;min-height:54px;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:6px 16px;text-align:center;box-shadow:0 4px 0 var(--green2)}
button.main small{font-weight:500;font-size:13px;opacity:.95}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green2)}
button.main.alt{background:var(--mt);box-shadow:0 4px 0 var(--mt2)}
button.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.7;margin:0;text-align:center}
.note a,.about a{color:var(--green2);display:inline-flex;align-items:center;min-height:44px}
/* ホーム */
.title{flex:none;font-family:var(--f-title);font-weight:900;font-size:42px;letter-spacing:.12em;text-align:center;margin:6px 0 0;padding-left:.12em}
.title span{color:var(--mt)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.8}
.hero{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:var(--sea)}
.hero svg{display:block;width:100%;height:auto}
.now{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.badge{background:var(--red);color:#fff;border-radius:9px;padding:1px 7px;font-size:12px}
/* 問題 */
.qcard{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 #17233a22;text-align:center}
.qcard .ask{margin:0;font-size:15px;color:var(--ink2)}
.qcard .ask b{color:var(--mt2);font-size:19px}
.qcard .from{margin:0;font-weight:900;font-size:18px;color:var(--green2)}
.qcard .from::before{content:"● ";color:var(--green)}
.qcard .clk{margin:2px 0;font-family:var(--f-title);font-weight:900;font-size:27px;line-height:1.3}
.qcard .ask b::before{content:"◆ ";color:var(--mt)}
.map{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:var(--sea)}
.map svg,.hero svg{display:block;width:100%;height:auto}
svg .land{fill:var(--land);stroke:#7b8aa3;stroke-width:.6;stroke-linejoin:round}
svg .band{stroke:var(--band);stroke-width:1}
svg .dl{stroke:#7f2f0f;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
svg .night{fill:#0e1c3d;fill-opacity:.26}
svg .lb{font-family:var(--f-body);font-weight:900;paint-order:stroke;stroke:#fdfcf8;stroke-width:5px;stroke-linejoin:round}
svg .sm{font-family:var(--f-body);font-weight:700;font-size:13px;fill:#46506a;paint-order:stroke;stroke:#fdfcf8;stroke-width:4px}
svg .pa{fill:var(--green);stroke:#fff;stroke-width:2.5}
svg .pb{fill:var(--mt);stroke:#fff;stroke-width:2.5}
svg .pf{fill:var(--green);stroke:#fff;stroke-width:1.2}
.dial{background:var(--paper);border:2px solid var(--mt);border-radius:14px;padding:10px 12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.dial .who{margin:0;font-size:14px;font-weight:700;color:var(--mt2)}
.dial .who::before{content:"◆ "}
.dial .val{margin:0;font-family:var(--f-title);font-weight:900;font-size:28px;line-height:1.3}
.dial .val small{display:block;font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--ink2)}
.dial .mv{margin:0;font-size:13px;color:var(--ink2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{all:unset;box-sizing:border-box;cursor:pointer;min-height:54px;border-radius:12px;border:1.5px solid var(--border);background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--ink);text-align:center;line-height:1.15}
.steps button:active{transform:translateY(2px)}
.steps button:disabled{opacity:.45;cursor:default}
.steps.fine{grid-template-columns:1fr 1fr}
.msg{margin:0;min-height:22px;text-align:center;font-size:15px;font-weight:700}
.msg.bad{color:var(--red)}
.msg.ok{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;min-height:0} /* 正解の知らせは読み上げだけ（見た目は下の正解の箱） */
.hint{background:var(--paper);border:1.5px dashed var(--green);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.verdict{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #17233a20;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:center;gap:10px;font-size:21px;font-weight:900}
.verdict ul{margin:0;padding-left:1.1em;line-height:1.8;font-size:15px}
.verdict .mn{margin:0;text-align:center;font-family:var(--f-title);font-weight:900;font-size:21px}
.stars{color:var(--gold);letter-spacing:.08em;font-size:20px}
.stars .off{color:#17233a33}
/* 結果・手帳・実績・カレンダー */
.big{font-weight:900;font-size:25px;text-align:center;margin:0}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rlist .w{flex:1;font-size:13px;color:var(--ink2);line-height:1.5;min-width:0}
.rlist .w b{display:block;color:var(--ink);font-size:16px}
.achnext{text-align:center;font-size:14px;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:14px;font-weight:700;color:var(--mt2);margin:0}
.agrp{font-size:13px;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:20px;text-align:center}
.ach b{grid-area:nm;font-size:15px}.ach small{grid-area:cd;color:var(--ink2);font-size:12px;line-height:1.4}
.ach .pg{grid-area:pg;font-size:13px;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--green)}
.ach.got{background:#e8f0f7;border-color:var(--green)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.area{display:flex;flex-direction:column;gap:6px}
.area h2{font-size:16px;margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.area h2 small{font-size:13px;color:var(--ink2);font-weight:700}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist div{display:flex;justify-content:space-between;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.mlist div b{font-size:15px}
.mlist div span{color:var(--ink2);text-align:right;font-size:13px}
.mlist div.no{border-style:dashed;background:transparent}
.mlist div.no b{color:var(--ink2);font-weight:700}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:17px}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:9px;color:var(--gold)}
.cal .c.p1{background:#e9eef4}.cal .c.p2{background:#cfdbe8}.cal .c.p3{background:var(--green);color:#fff;border-color:var(--green2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--green);color:var(--green2)}
.cal .c.miss{cursor:pointer;border:1.5px dotted var(--red);color:var(--red);background:#fff}
.cal .c.miss i{color:var(--red)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:9px;color:var(--red);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.about{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px;line-height:1.8}
.about h3{font-size:16px;margin:12px 0 4px}
.about ul{padding-left:1.2em;margin:4px 0}
dialog{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.1em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--green2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 色の見分けを助ける：出す町は青の●、答える町は橙の◆（形でも分ける）。夜のかげは濃く */
html.a11y-cvd{--green:#0b5d91;--green2:#073f63;--red:#b34700;--mt:#a35200;--mt2:#6b3600}
html.a11y-cvd svg .night{fill-opacity:.34}
html.a11y-cvd svg .dl{stroke-dasharray:2 3;stroke-width:2.2}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:is(.icon,button,a):focus-visible{outline:3px solid #1a5fd0!important;outline-offset:2px}
</style>

  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  const P = cur.P, v = cur.v;
  if (v !== P.want) {
    const msg = $("msg"); msg.className = "msg bad";
    if (cur.wrong.includes(v)) { msg.textContent = "その時刻は、もう試しました。"; return; }
    buzz(40);
    cur.wrong.push(v); keep(); paint();
    msg.textContent = (v - P.want) % 1440 === 0 ? "✕ 時刻は合っています。日付をもう一度考えましょう。" : v < P.want ? "✕ ちがう。もっと進めます。" : "✕ ちがう。もっともどします。";
    return;
  }
  // 正解
  cur.done = true; buzz([10, 40, 10]);
  const B = G.BY[P.to];
  // 別のタブで使ったヒント・まちがいも数えてから採点する（keep と同じ合わせ方）
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; merge(r); r.res.push({ m: missOf() }); r.cur = null; if (r.mode === "e") { r.miss = (r.miss || 0) + missOf(); s.elast = P.ans; } s.dex[P.ans] = (s.dex[P.ans] || 0) + 1; { const nk = P.lv + ":" + P.ans; if (missOf() > 0) s.ng[nk] = (s.ng[nk] || 0) + 1; else delete s.ng[nk]; } });
  const r = s.runs[MODE], fin = r && r.mode !== "e" && r.res.length >= r.list.length, st = starsOf(missOf());
  paint();
  $("msg").className = "msg ok"; $("msg").textContent = `✓ 正解！ ${B.name}は ${whenStr(P.k, P.want)}。${fin ? "「結果を見る」" : "「次の問題へ」"}で進みます。`; // 前からある知らせの場所で読ませる（入れたばかりの role=status は読まれないことがある）
  $("after").innerHTML = `<div class="verdict">
    <div class="hd" data-a11y-say>✓ 正解！ ${starStr(st)}</div>
    <p class="mn" data-a11y-say>${esc(B.name)}は ${esc(whenStr(P.k, P.want))}</p>
    <ul>${G.facts(P).map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
    <button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on && A11y.on("calm") ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null; // 別のタブで新しい回が始まっていたら、それは消さない
    newAch = achGot(s2).filter((id) => !s2.ach[id]); // まだ知らせていない実績は、前の回で取ったものも知らせる
    for (const id of newAch) s2.ach[id] = 1;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：当てた数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {
  const n = run.res.length, miss = num(run.miss); let prev = 0, newAch = [];
  save((s2) => { prev = s2.ebest || 0; s2.ebest = Math.max(prev, n); const c = s2.runs.e; if (c && c.id === run.id) s2.runs.e = null; newAch = achGot(s2).filter((id) => !s2.ach[id]); for (const id of newAch) s2.ach[id] = 1; });
  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>世界の時刻<small>とことん</small></h1></header>
    <p class="big" id="eres" data-a11y-say>${n}問 当てました</p>
    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : `自己ベスト ${s.ebest}問${s.ebest > n ? `（あと${s.ebest - n + 1}問で更新）` : ""}`}<br>まちがい・ヒント ${miss}回</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    ${ngBtn()}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">町の手帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = () => practiceMenu(); bindNg(); $("go-dex").onclick = () => book();
  toTop();
}
// 共有の文：町の名前・時刻（答え）は出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `世界の時刻${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " まちがいなし" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load(), rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const list = mode === "p" ? prec.list : listOf(mode, k), total = rec.m.reduce((a, b) => a + b, 0), late = mode === "a", text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>世界の時刻<small>${mode === "d" ? `今日の5問 第${dayNo(k)}回` : late ? `第${dayNo(k)}回 あとから` : mode === "h" ? "上級" : "練習"}</small></h1></header>
    <p class="big" data-a11y-say>${total === 0 ? "全部まちがいなし！" : `${list.length}問 当てました`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag), A = G.BY[P.from], B = G.BY[P.to]; return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w"><b>${esc(A.name)} → ${esc(B.name)}</b>${G.clock24(P.m)} → ${esc(whenStr(P.k, P.want))}（${P.offTo - P.offFrom === 0 ? "時差なし" : (P.offTo > P.offFrom ? "+" : "−") + G.hoursStr(P.offTo - P.offFrom)}）</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟢まちがいなし　🔶1回　🔺2回以上<br>次の5問まで あと <b>${untilNext()}</b></p>` : ""}
    <button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}問）` : ""}</button>
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="sub" id="go-h">上級：むずかしい3問</button>` : ""}
    ${ngBtn()}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">町の手帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = () => practiceMenu(); bindNg(); $("go-dex").onclick = () => book();
  $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// 町の手帳：地域ごとに当てた町。まだの町は名前だけ（点線の枠）。地域ごとの練習もここから
function book() {
  const s = load(), f = foundOf(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>町の手帳<small>${f.length}/${G.IDS.length}の町</small></h1></header>
    <p class="note" data-a11y-say>当てた町が地域ごとに集まります。UTC との差と、サマータイムの有無も分かります。</p>
    ${G.AREAS.map((name, a) => { const all = G.IDS.filter((id) => G.BY[id].area === a), n = all.filter((id) => s.dex[id] > 0).length; return `<section class="area"><h2>${n === all.length ? "✓ " : ""}${name}<small>${n}/${all.length}</small></h2>
      <div class="mlist">${all.map((id) => { const c = G.BY[id], ok = s.dex[id] > 0; return ok ? `<div><b>✓ ${esc(c.name)}<small style="font-weight:500;color:var(--ink2)">（${esc(c.country)}）</small></b><span>${G.offStr(c.std)}${c.dst ? `<br>夏は ${G.offStr(c.std + 60)}` : ""}</span></div>` : `<div class="no"><b>${esc(c.name)}</b><span>まだ</span></div>`; }).join("")}</div>
      <button class="sub" data-a="${a}">${name}の町で練習する</button></section>`; }).join("")}
    ${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => practiceMenu(b.dataset.a)));
  bindFooter(); toTop();
}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.m) ? rec.m.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hd ? "・上級も" : ""}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span>★★★ まちがいなし</span><span>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span><span>▶ あとから遊べる</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}

    <div class="about" id="about">

        <li>日本標準時：<a href="https://www.nict.go.jp/sts/jst.html" target="_blank" rel="noopener">情報通信研究機構（NICT）</a>、<a href="https://eco.mtk.nao.ac.jp/koyomi/wiki/C9B8BDE0BBFE.html" target="_blank" rel="noopener">国立天文台 暦Wiki「標準時」</a>。</li>
        <li>サマータイム：<a href="https://eur-lex.europa.eu/eli/dir/2000/84/oj/eng" target="_blank" rel="noopener">EU 指令 2000/84/EC</a>、<a href="https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst" target="_blank" rel="noopener">アメリカ国立標準技術研究所（NIST）</a>。</li>
        <li>地図の陸の形：<a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>（パブリックドメイン）。昼と夜のかげは、太陽の位置からのだいたいの計算です。</li>
      </ul>
      <p>旅行や仕事で時刻を確かめるときは、そのときの公式の情報を見てください。記録はこの端末のブラウザの中だけに残り、外へは送りません。</p>

}

window.__sj = { mode: () => MODE, load, save, todayKey, dayNo, lateDays, ACH, achGot, nextAch, tally, shareText, streak, endlessList, practiceList, cur: () => cur, play: (m) => { if (m) MODE = m; play(); }, home, cal, book, about, worldSvg, nightPath, sunAt, EPOCH, KEY, G };
